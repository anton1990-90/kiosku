name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'
          cache: false

      - name: Tampilkan versi Flutter
        run: flutter --version

      - name: Generate folder android
        run: flutter create . --project-name tokoku --platforms android

      - name: Beri izin eksekusi Gradle
        run: chmod +x android/gradlew

      - name: Tambah izin Android (kamera & bluetooth)
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p) as f: content = f.read()
          perms = '    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.BLUETOOTH\" />\n    <uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" />\n    <uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" />\n    <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n'
          if '<uses-permission' not in content:
              content = content.replace('<application', perms + '    <application')
              with open(p, 'w') as f: f.write(content)
          print(content)
          "

      - name: Set compileSdk 35 dan minSdk 21
        run: |
          python3 -c "
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = re.sub(r'compileSdk(?:Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 35', s)
          s = re.sub(r'minSdk(?:Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 21', s)
          open(p, 'w').write(s)
          print(s)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Analisa kode (hanya info, tidak menggagalkan build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokoku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish APK ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TokoKu APK (build terbaru)
          body: |
            APK TokoKu - build otomatis dari branch main.

            Unduh `app-release.apk` di bawah, lalu instal di HP Android
            (aktifkan "Instal dari sumber tidak dikenal").
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
