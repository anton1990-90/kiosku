name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # manual trigger dari tab Actions

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Generate folder android (jika belum ada)
        run: flutter create . --project-name tokoku --platforms android

      - name: Tambah izin Android (kamera + bluetooth)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p) as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
      '''
          content = content.replace('<application', perms + '    <application', 1)
          with open(p, 'w') as f:
              f.write(content)
          print('Android permissions ditambahkan')
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokoku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
