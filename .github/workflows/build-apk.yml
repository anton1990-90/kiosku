name: Build APK

# Kapan build ini menyala.
#
# Tujuannya: build APK hanya jalan kalau ada yang benar-benar mengubah
# APLIKASINYA. Perubahan di cloudflare/ atau docs/ tidak memengaruhi isi APK
# sama sekali — server aktivasi diterbitkan terpisah lewat `wrangler deploy`.
# Tanpa penyaring ini, memperbaiki satu salah ketik di dokumen pun membangun
# ulang APK 34 MB dan menimpa berkas rilis yang sedang dipakai pelanggan.
#
# Aman: kalau satu push menyentuh `lib/` SEKALIGUS `docs/`, build tetap jalan
# — `paths-ignore` hanya melewati push yang SELURUH berkasnya diabaikan.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'cloudflare/**'   # Worker diterbitkan lewat `wrangler deploy`
      - 'docs/**'         # panduan untuk penjual, bukan bagian APK
      - '**/*.md'         # README dan catatan lain
      - '.gitignore'      # tidak ikut masuk ke APK
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'
          cache: false

      - name: Tampilkan versi Flutter
        run: flutter --version

      - name: Baca versi aplikasi dari pubspec
        id: ver
        run: |
          python3 -c "
          import re
          s = open('pubspec.yaml').read()
          m = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)', s, re.M)
          print('version=' + m.group(1))
          " >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Generate folder android
        run: flutter create . --project-name tokoku --platforms android

      - name: Beri izin eksekusi Gradle
        run: chmod +x android/gradlew

      - name: Siapkan keystore rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/tokoku-release.jks
            echo "Keystore rilis terpasang: $(stat -c%s android/app/tokoku-release.jks) byte"
          else
            echo "::warning::KEYSTORE_BASE64 belum diisi. APK akan ditandatangani DEBUG KEY dan tidak bisa dipakai untuk update. Jangan dijual sebelum secrets diisi."
          fi

      - name: Patch konfigurasi Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/ci_patch.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analisa kode (info & peringatan tidak menggagalkan build, ERROR menggagalkan)
        # Hanya `lib/`. Folder `test/` dibuat oleh `flutter create .` di langkah
        # sebelumnya dan memakai nama `MyApp` bawaan template, yang bukan kelas
        # di proyek ini — menganalisa folder itu akan selalu merah karena berkas
        # yang kita sendiri hasilkan.
        #
        # `|| true` DIHAPUS. v1.14.0 membuktikan harganya: satu `const _akibat(...)`
        # (method, bukan konstruktor) tercetak sebagai ERROR di sini lalu
        # diabaikan, dan build baru gagal tiga menit kemudian di dalam Gradle
        # dengan pesan yang jauh lebih samar. Analisa yang tidak bisa menggagalkan
        # apa pun bukan pemeriksaan, melainkan hiasan.
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build APK release
        # PENTING: ci_patch.py menulis `System.getenv("KEYSTORE_PASSWORD")` dan
        # kawan-kawan ke dalam android/app/build.gradle. Artinya password itu
        # dibaca saat LANGKAH INI berjalan, bukan saat dipatch. Kalau env-nya
        # tidak diteruskan ke sini, Gradle berhenti dengan
        # "SigningConfig \"release\" is missing required property
        # \"storePassword\"".
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokoku-apk-v${{ steps.ver.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish APK ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TokoKu v${{ steps.ver.outputs.version }}
          body: |
            APK TokoKu versi ${{ steps.ver.outputs.version }}.

            Unduh `app-release.apk` lalu instal di HP Android.
            Aplikasi versi lama akan otomatis menawarkan pembaruan ini.
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
