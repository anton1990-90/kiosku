# ============================================================================
# TokoKu — konfigurasi Cloudflare Worker
#
# Deploy:
#   npx wrangler deploy
#
# Rincian langkah ada di cloudflare/README.md
# ============================================================================

name = "tokoku-lisensi"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Akun gratis Cloudflare sudah cukup:
#   * 100.000 permintaan per hari
#   * TIDAK ada pembekuan karena tidak dipakai (beda dengan Supabase)
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "tokoku-lisensi"
database_id = "7b228966-1656-4c35-9ed8-f8e3e3f88377"

[vars]
# Nama aplikasi yang muncul di halaman portal.
APP_NAME = "TokoKu"
# Nomor WhatsApp dukungan (format 628..., boleh dikosongkan).
SUPPORT_WHATSAPP = ""

# Repo tempat rilis APK disimpan. Nilai ini HANYA ada di sisi server —
# pelanggan tidak pernah melihatnya. Aplikasi meminta versi & file APK
# lewat Worker ini (GET /api/versi dan GET /unduh/apk), jadi akun GitHub
# penjual tidak pernah muncul di HP pelanggan.
GITHUB_REPO = "anton1990-90/kiosku"
