workflows:
  android-build:
    name: TokoKu Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate android folder (jika belum ada)
        script: flutter create . --project-name tokoku --platforms android
      - name: Tambah izin Android
        script: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p) as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
      '''
          content = content.replace('<application', perms + '    <application', 1)
          with open(p, 'w') as f:
              f.write(content)
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - user@example.com
